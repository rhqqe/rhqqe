  <text x="600" y="43" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#8BA8BB">RHQQE / BUILD · UNDERSTAND · REFINE</text>
