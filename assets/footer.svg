<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Build, understand, refine</title>
  <desc id="desc">A thin blue and mint rule framing the rhqqe wordmark.</desc>
  <defs>
